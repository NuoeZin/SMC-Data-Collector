name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential ccache cmake git libffi-dev \
            libltdl-dev libncurses5-dev libncursesw5-dev libssl-dev \
            libtool libtool-bin pkg-config unzip zip zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5,<2" "cython>=0.29,<3.1"

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if buildozer android debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts."
              exit 1
            fi
            echo "Temporary build/download failure; retrying in 30 seconds..."
            sleep 30
          done

      - name: List build output
        if: always()
        run: find bin -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SimmcGDP-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
